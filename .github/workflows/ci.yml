name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    # GitHub-hosted on purpose: a public repo runs fork PRs, which must never reach a self-hosted runner.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install the Almadar language data
        run: npm install --no-save --no-package-lock @almadar/core@^10 @almadar/std@^16 @almadar/lolo-ar@^1 @almadar/lolo-sl@^1

      - uses: dtolnay/rust-toolchain@1.93.0

      - name: Install orb
        run: npm install --no-save --no-package-lock @almadar/orb@^18

      - name: T4 gate (every crate's tests, ratcheted against scripts/gates/known-failures)
        run: ORB="npx orb" bash scripts/gates/t4.sh

  windows-host:
    # The Windows file host and drive-rooted grants compile and run only here; the rest of the suite uses Unix-shaped
    # fixture paths and runs in the test job.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.93.0
      - name: Grant matching
        run: cargo test --manifest-path crates/base/Cargo.toml os_grants::tests::a_drive_
      - name: File host
        run: cargo test --manifest-path crates/runtime/Cargo.toml os_host::fs::tests_windows
