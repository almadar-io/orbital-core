[package]
name = "orbital-core"
version = "18.0.0"
edition = "2021"
license = "BUSL-1.1"
repository = "https://github.com/almadar-io/orbital-core"
description = "Core types and runtime for Orbital schema execution"

[features]
default = ["wire-drivers"]
wire-drivers = ["orbital-core-runtime/wire-drivers"]
async = ["orbital-core-base/async"]
client-http = ["orbital-core-runtime/client-http"]
native-transport = ["orbital-core-runtime/native-transport"]

[dependencies]
orbital-core-base = { path = "crates/base" }
orbital-core-eval = { path = "crates/eval" }
orbital-core-runtime = { path = "crates/runtime", default-features = false }

[dev-dependencies]
tempfile = "3.10"
pretty_assertions = "1.4"
tokio = { version = "1.0", features = ["full", "rt", "macros"] }
syn = { version = "2", features = ["full"] }
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }
ts-rs = "12.0.1"
serde_json = { version = "1.0", features = ["preserve_order"] }

[[bench]]
name = "parity_fixtures"
harness = false

[[bench]]
name = "floor_native"
harness = false

# `std::time::SystemTime::now()` / `chrono::Utc::now()` panic on bare wasm32; the wasm
# build reads the clock through `js_sys::Date` (see `time_util`). wasm32-only.
