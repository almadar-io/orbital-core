[package]
name = "orbital-core-eval"
version = "18.0.0"
edition = "2021"
license = "BUSL-1.1"
repository = "https://github.com/almadar-io/orbital-core"
description = "orbital-core layer: eval"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
thiserror = "1.0"
lru = "0.12"
tracing = "0.1"
chrono = { version = "0.4", features = ["serde"] }
parking_lot = "0.12"
sha2 = "0.10"
base64 = "0.22"
regex = "1.10"
quick-xml = "0.38"
icu_collator = { version = "2.3", features = ["unstable"] }
ts-rs = { version = "12.0.1", optional = true }
orbital-core-base = { path = "../base" }

[features]
ts-export = ["dep:ts-rs"]
async = ["orbital-core-base/async"]

[dev-dependencies]
orbital-core = { path = "../.." }
