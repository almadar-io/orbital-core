[package]
name = "orbital-core-runtime"
version = "18.0.0"
edition = "2021"
license = "BUSL-1.1"
repository = "https://github.com/almadar-io/orbital-core"
description = "orbital-core layer: runtime"

[dependencies]
indexmap = { version = "2", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
thiserror = "1.0"
tracing = "0.1"
chrono = { version = "0.4", features = ["serde"] }
parking_lot = "0.12"
smallvec = "1"
sha2 = "0.10"
base64 = "0.22"
web-time = "1.1"
aes-gcm = { version = "0.10", default-features = false, features = ["aes", "alloc"] }
p256 = { version = "0.13", default-features = false, features = ["alloc", "ecdh", "ecdsa", "pem"] }
rsa = { version = "0.9", default-features = false, features = ["pem", "sha2"] }
url = "2"
rustls = { version = "0.23", default-features = false, features = ["tls12"] }
webpki-roots = "1"
x25519-dalek = { version = "2", default-features = false, features = ["static_secrets"] }
p384 = { version = "0.13", default-features = false, features = ["ecdsa"] }
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }
hmac = "0.12"
rand_chacha = { version = "0.3", default-features = false }
ureq = { version = "2.9", default-features = false, features = ["json"], optional = true }
orbital-core-base = { path = "../base" }
orbital-core-eval = { path = "../eval" }

[features]
async = ["orbital-core-eval/async"]
client-http = ["dep:ureq"]
# The native HTTP(S) transport of a server-role host (ureq + rustls); off for wasm32 and for hosts that bring their own `Transport`.
native-transport = ["dep:ureq", "ureq/tls"]

[dev-dependencies]
tempfile = "3.10"
ts-rs = "12.0.1"
orbital-core-base = { path = "../base", features = ["ts-export"] }
orbital-core-eval = { path = "../eval", features = ["ts-export"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
getrandom = "0.2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
